# Checks, builds and deploys the website, the Cloud Functions and the Firestore and Storage rules on
# every push to main (or by hand). Google Cloud auth is keyless (Workload Identity Federation).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FIREBASE_TOOLS: firebase-tools@15.34.1

jobs:
  deploy:
    name: Check, build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only the website, the functions, the shared core and the root tools: the phone app's
      # packages are not needed here.
      - name: Install
        run: npm ci --workspace @youngvista/core --workspace @youngvista/web --workspace @youngvista/functions --include-workspace-root

      - name: Type-check
        run: |
          npm run typecheck --workspace @youngvista/core --workspace @youngvista/web --workspace @youngvista/functions
          npx tsc -p tests/rules

      - name: Lint
        run: npx eslint packages/core apps/web functions tests eslint.config.js

      - name: Unit tests
        run: npm test --workspace @youngvista/core --workspace @youngvista/functions

      # The Firestore and Storage emulators need Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Security rules tests
        run: npm run test:rules

      - name: Build website
        run: npm run build:web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # --force: functions removed from the source are deleted, and the container image cleanup
      # policy is set without asking.
      - name: Deploy Hosting, Functions, Firestore and Storage
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting,functions,firestore,storage --project young-vista --non-interactive --force
